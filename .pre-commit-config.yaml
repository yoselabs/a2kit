repos:
  - repo: local
    hooks:
      - id: a2kit-lint
        name: a2kit static lint
        entry: uv run a2kit lint static src/ tests/ examples/
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff
        name: ruff check
        entry: uv run ruff check
        language: system
        pass_filenames: true
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        pass_filenames: true
        types_or: [python, pyi]
      - id: adr-index
        name: ADR frontmatter valid + index up to date
        entry: uv run python scripts/adr_index.py --check
        language: system
        pass_filenames: false
        files: ^docs/adr/(.*\.md|schema\.json)$
      - id: component-map
        name: component map up to date
        entry: uv run python scripts/component_map.py --check
        language: system
        pass_filenames: false
        files: ^(src/a2kit/.*\.py|docs/COMPONENT_MAP\.md)$
      - id: pymarkdown
        name: markdown lint (pymarkdownlnt)
        entry: uv run pymarkdown --config .pymarkdown.json scan
        language: system
        pass_filenames: true
        files: ^(docs/.*\.md|README\.md|CHANGELOG\.md|AGENTS\.md|CLAUDE\.md)$
      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        pass_filenames: false
        files: ^\.github/workflows/.*\.ya?ml$
      - id: ty
        name: ty (typecheck src)
        entry: uv run ty check src/
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: ty-tests
        name: ty (typecheck tests)
        entry: uv run ty check tests/
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: rego
        name: a2kit lint rego (architectural policies)
        # Shells out to the pinned `opa` binary (clear error if absent);
        # a global name-collision scan, so it runs on the whole tree.
        entry: uv run a2kit lint rego src/
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
