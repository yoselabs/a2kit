[project]
name = "a2kit"
version = "0.39.3"
description = "Fat tool decorator on top of FastMCP — protocol-agnostic core, opt-in plugin packages."
readme = "README.md"
authors = [{name = "Denis Tomilin"}]
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["mcp", "fastmcp", "model-context-protocol", "agents", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "anyio>=4",
    "click>=8",
    "fastmcp>=3.2,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2.14,<3",
    "tomli-w>=1",
    "typer>=0.25,<1",
]

[project.scripts]
a2kit = "a2kit.__main__:main"

[project.urls]
Homepage = "https://github.com/yoselabs/a2kit"
Repository = "https://github.com/yoselabs/a2kit"
Issues = "https://github.com/yoselabs/a2kit/issues"
Changelog = "https://github.com/yoselabs/a2kit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
testing = [
    "syrupy>=4",
    "vcrpy>=6",
]
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]
# Sandboxed code-execution surface. `pydantic-monty` backs FastMCP's
# `experimental.transforms.CodeMode`; imported only by
# `a2kit.packages.codemode`, never on the `import a2kit` path.
code-mode = [
    "pydantic-monty>=0.0.17",
]
# `examples/mcp_google_auth/` Google-mode dependencies. Bearer-only mode
# (used by `make example-smoke`) needs none of these. See
# docs/patterns/remote-mcp-access.md.
examples-mcp-google-auth = [
    "py-key-value-aio[disk]>=0.4",
    "cryptography>=42",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2kit"]

[tool.ruff]
target-version = "py311"
line-length = 140
output-format = "concise"

[tool.ruff.lint]
select = [
    "F", "S", "T10", "T20", "BLE", "PGH",
    "E", "W", "I", "N", "UP", "C4", "PIE", "TC", "PTH", "FURB", "RUF",
    "B", "A", "DTZ", "ISC", "RET", "SIM", "ARG", "PERF", "LOG", "G", "SLF", "TID", "PL",
    "C90", "EM", "FBT", "PT",
    "ANN",
]
ignore = [
    "SIM108", "SIM110", "RUF001", "RUF015",
    "EM101", "EM102", "FBT001", "FBT002",
    "PLR0913", "PLR2004", "ARG001",
    "A003", "PT001", "PT023", "PERF203", "RET504", "PLW2901",
    "ANN401",
    # B008: `Depends(...)` as a parameter default is the canonical v1.0 DI form
    # (uncalled_for). Spec explicitly requires `*, x: T = Depends(g)`.
    "B008",
    # N818: a2kit exception names follow the spec verbatim — `WriteNotAllowed`,
    # `InvalidFilterExpression`, etc. Renaming would break the public surface.
    "N818",
    # PLC0415: lazy imports are intentional v1.0 — LazyGroup defers fastmcp,
    # PEP 562 `__getattr__` resolves package imports on attribute access, etc.
    "PLC0415",
    # RUF102: a2kit's own static linter uses `# noqa: A2K014` / `A2K-CORE-CLEAN`
    # etc. — ruff doesn't recognise these codes but the suppression is read by
    # a2kit lint, not ruff. Silence the false-positive.
    "RUF102",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8
max-statements = 50
max-branches = 12
max-returns = 6

[tool.ruff.lint.flake8-type-checking]
# `@a2kit.read/write/list_/tool` decorators resolve return-type annotations at
# decoration time (compute_schema). Tell ruff so TC001/2/3 don't advise authors
# to push annotation-referenced types under TYPE_CHECKING.
runtime-evaluated-decorators = [
    "a2kit.tool",
    "a2kit.list_",
    "a2kit.read",
    "a2kit.write",
    "tool",
    "list_",
    "read",
    "write",
]
# `ConnectionConfig` subclasses inherit pydantic-settings BaseSettings; field
# annotations are runtime-evaluated.
runtime-evaluated-base-classes = ["a2kit.packages.connections.ConnectionConfig"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", "S105", "S106", "E402", "ARG001", "ARG002", "ARG005", "PLR2004", "SLF001",
    "PT011", "PT012", "PT018", "PT022", "PT030", "PLR0915", "PLC0415", "PTH116", "PTH123", "TC001", "TC002", "TC003",
    "I001", "RUF100", "RUF012", "PLW0108", "F841", "N801",
    "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206",
    # Tests intentionally use blind asserts, subprocess calls, broad string patterns,
    # builtin shadowing for clarity, and bind to local addresses for HTTP probes.
    "B017", "S603", "S104", "A002", "A004", "E501",
]
"scripts/**" = ["T201", "BLE001", "C901", "PLR0912", "PLR0915", "ANN001", "ANN201", "ANN202", "RUF059"]
"evals/**" = ["T201", "S101", "BLE001", "C901", "PLR0912", "PLR0915", "ANN001", "ANN201", "ANN202", "S603", "S607"]
"bench/**" = ["T201", "BLE001", "S603", "ANN001", "ANN201", "PLR0915"]
"examples/**" = [
    # Examples declare ``ctx: a2kit.ToolContext`` to opt into Context
    # injection from the framework. After the ambient-LDD-ctx-binding
    # change, primitive calls no longer take ``ctx`` explicitly, so the
    # parameter is declared but unused.
    "ARG002",
    # Annotations relaxed: examples are tutorial code, not library code.
    "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN206",
    # TYPE_CHECKING shifts hurt readability in tutorial code.
    "TC001", "TC002", "TC003",
    # Examples intentionally pass demo strings to functions that accept
    # password-like params; not real secrets.
    "S105", "S106",
]
"examples/**/tests/**" = [
    # Example smoke tests inherit the same test-style allowances as tests/**.
    "S101", "B017", "PT011", "ARG001", "PLC0415", "I001",
]
"src/a2kit/app.py" = ["SLF001"]
# DI container's parent/child design crosses instance boundaries within the
# same class (root <-> children share private state). Cleanup-stack and
# resolve-hints fallbacks catch broadly per CLAUDE.md case 1/case 2.
"src/a2kit/packages/di/container.py" = ["SLF001"]
# Production dispatch sites access app._resolver (Resolver protocol surface).
# The underscore is convention-private but the attribute is the framework's
# intentional handle for the dispatch helper. See dispatch-lifecycle-wiring.
"src/a2kit/packages/mcp/server.py" = ["SLF001"]
"src/a2kit/packages/mcp/_wrappers.py" = ["SLF001"]
"src/a2kit/packages/cli/runtime.py" = ["SLF001"]
"src/a2kit/packages/di/_cleanup_stack.py" = ["BLE001"]
"src/a2kit/packages/di/_hints.py" = ["BLE001"]
# CLI builder synthesizes Click commands from arbitrary tool signatures —
# inherently many branches per parameter type. PLR0915 / C901 reflect that.
"src/a2kit/packages/cli/builder.py" = ["C901", "PLR0915", "PERF401"]
# connections CLI inspects ConnectionConfig internals (Key NamedTuple, _path);
# the factory builds 5 Click subcommands inline so it's structurally branchy.
"src/a2kit/packages/connections/cli.py" = ["SLF001", "C901", "PLR0915"]
# format heuristic dispatches by type-shape — many returns is structural.
"src/a2kit/packages/formatter/__init__.py" = ["PLR0911"]
# MCP context schedules log coroutines without awaiting; design D-ToolContext.
"src/a2kit/packages/mcp/context.py" = ["RUF006"]
# listview rewrites payloads defensively — must catch any handler exception.
"src/a2kit/packages/mcp/listview.py" = ["PLR0911", "BLE001"]
# syrupy's serialize signature is fixed; we accept and ignore **kwargs.
"src/a2kit/packages/testing/snapshots.py" = ["ARG002"]
# rebuild_with_factories iterates conditionally; comprehension would obscure.
"src/a2kit/routers.py" = ["PERF401"]
# signature.find_context_param swallows any get_type_hints failure (unresolved
# forward refs, etc.) — fall back to inspect.signature defaults silently.
"src/a2kit/signature.py" = ["BLE001"]
# coverage-extras tests intentionally use legacy/edge-case shapes (Optional,
# Union, /tmp paths, unused tuple unpacks) to exercise dead corners.
"tests/test_extras_coverage.py" = ["F401"]
"tests/test_extras_coverage_2.py" = ["S108", "SIM300", "UP045", "RUF059"]
"tests/test_signature_class_depends.py" = ["S108", "F841"]
"tests/test_routers_enricher.py" = ["F841"]
"tests/packages/lint/test_rules_misc.py" = ["S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --import-mode=importlib: load test modules by file path, avoiding sys.modules
# collisions between same-named test packages.
addopts = "-v --strict-markers --import-mode=importlib --cov --cov-report=term-missing --cov-fail-under=90"
# pythonpath: importlib mode skips rootdir injection; restore for `examples.*` imports.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/a2kit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6",
    "ruff>=0.9",
    "syrupy>=4",
    "ty>=0.0.34",
    "vcrpy>=6",
    "diff-cover>=9",
    "hypothesis>=6",
    "opentelemetry-sdk>=1.20",
    # Monty sandbox runtime — backs the code-execution surface and its
    # tests (the `a2kit[code-mode]` extra). See a2kit.packages.codemode.
    "pydantic-monty>=0.0.17",
    "mutmut>=3.5",
    "cosmic-ray>=8.4.6",
    # ADR index generator (scripts/adr_index.py) — parses YAML frontmatter
    # from docs/adr/*.md, validates against docs/adr/schema.json, and renders
    # docs/adr/INDEX.md via Jinja. All three libs are mature ecosystem
    # standards. The script is thin orchestration; no bespoke YAML, JSON
    # Schema, or markdown parsing.
    "python-frontmatter>=1.1",
    "jinja2>=3.1",
    "jsonschema>=4",
    # Pre-commit framework — runs the staleness gates (ADR frontmatter
    # validity + INDEX freshness, ruff, ty, etc.) on every commit. Without
    # this, the .pre-commit-config.yaml hooks are decorative.
    "pre-commit>=4",
    # Markdown linter for docs/. Python-native (matches the rest of the
    # tooling stack); no Node toolchain. Configured in .pymarkdown.json.
    "pymarkdownlnt>=0.9",
]

[tool.mutmut]
paths_to_mutate = ["src/a2kit/"]
tests_dir = ["tests/"]
# also_copy: examples/ is referenced by tests/examples/streaming_logger/
#   (`from examples.streaming_logger.server import app`). Without it, mutmut's
#   mutants/ rootdir is missing the package and pytest collection errors out.
also_copy = ["examples/"]
# -x: stop on first failure (mutmut only needs "did any test fail").
# --no-cov: running coverage on every mutation is wasteful.
# --import-mode=importlib: matches pytest config.
pytest_add_cli_args = [
    "-x",
    "--no-cov",
    "--import-mode=importlib",
    # why: this test asserts a `# ty: ignore` budget by scanning src/.
    #   Under mutmut the source tree is rewritten with trampoline scaffolding
    #   that inflates the count past budget. Irrelevant under mutation.
    "--deselect=tests/test_type_correctness_gate.py::test_ty_ignore_count_under_budget",
    # why: this test re-imports a2kit and times it. mutmut's trampoline
    #   adds startup overhead that breaches the 100ms cold-start budget.
    "--deselect=tests/test_cold_start.py::test_import_a2kit_under_100ms_and_no_fastmcp",
]
do_not_mutate = [
    # why: Protocol class — no runtime behavior to mutate.
    "src/a2kit/runtime.py",
    # why: frozen dataclass; construction is the only behavior.
    "src/a2kit/metadata.py",
    # why: pure re-export modules.
    "src/a2kit/**/__init__.py",
    # why: Click group entry point; no mutable behavior beyond dispatch.
    "src/a2kit/__main__.py",
    # why: mutmut 3.5's trampoline injects `self` references into mutated
    #   functions, but `__init_subclass__` is implicitly a classmethod
    #   (first arg is `cls`). Mutating this file fails collection with
    #   `NameError: name 'self' is not defined`. File an upstream bug,
    #   then revisit. Coverage gap acknowledged in MUTATION_BASELINE.md.
    "src/a2kit/packages/connections/config.py",
]

[tool.a2kit.lint]
disabled = []

[tool.a2kit.check]
disabled = []

[tool.a2kit.budgets]
total = 0

