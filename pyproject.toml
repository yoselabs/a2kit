[project]
name = "a2kit"
version = "0.16.0.dev0"
description = "Thin library on top of FastMCP — additive primitives for connection management, tool decoration, schema snapshots, router-module registration, lint, capabilities + select grammar, and HTTP cassette testing."
readme = "README.md"
authors = [{name = "Denis Tomilin"}]
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["mcp", "fastmcp", "model-context-protocol", "agents", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "anyio>=4",
    "click>=8",
    "opentelemetry-api>=1.20",
    "pydantic>=2,<3",
    "tomli-w>=1",
]

[project.scripts]
a2kit = "a2kit.lint.cli:main"

[project.urls]
Homepage = "https://github.com/yoselabs/a2kit"
Repository = "https://github.com/yoselabs/a2kit"
Issues = "https://github.com/yoselabs/a2kit/issues"
Changelog = "https://github.com/yoselabs/a2kit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
testing = [
    "vcrpy>=6",
]
projection = [
    "cel-python>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2kit"]

[tool.ruff]
target-version = "py311"
line-length = 140
output-format = "concise"

[tool.ruff.lint]
select = [
    "F", "S", "T10", "T20", "BLE", "PGH",
    "E", "W", "I", "N", "UP", "C4", "PIE", "TC", "PTH", "FURB", "RUF",
    "B", "A", "DTZ", "ISC", "RET", "SIM", "ARG", "PERF", "LOG", "G", "SLF", "TID", "PL",
    "C90", "EM", "FBT", "PT",
    "ANN",
]
ignore = [
    "SIM108", "SIM110", "RUF001", "RUF015",
    "EM101", "EM102", "FBT001", "FBT002",
    "PLR0913", "PLR2004", "ARG001",
    "A003", "PT001", "PT023", "PERF203", "RET504", "PLW2901",
    "ANN401",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8
max-statements = 50
max-branches = 12
max-returns = 6

[tool.ruff.lint.flake8-type-checking]
# Tool decorators resolve function annotations at decoration time via
# `inspect.get_annotations(fn, eval_str=True)`. Annotation-referenced types
# (typically `ConnectionInfo` subclasses) must therefore be importable at
# runtime, not just under TYPE_CHECKING. Telling ruff about the decorators
# stops TC001 from advising authors to break their tools.
runtime-evaluated-decorators = [
    "a2kit.tool",
    "a2kit.list",
    "a2kit.read",
    "a2kit.write",
    # Router-method forms — ruff matches the trailing attribute name.
    "list",
    "read",
    "write",
    "tool",
]
# `ConnectionInfo` subclasses are themselves runtime-evaluated by Pydantic.
runtime-evaluated-base-classes = ["a2kit.ConnectionInfo"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", "S105", "S106", "E402", "ARG001", "ARG002", "ARG005", "PLR2004", "SLF001",
    "PT011", "PT018", "PT022", "PT030", "PLR0915", "PLC0415", "PTH116", "TC001", "TC002", "TC003",
    "I001", "RUF100", "RUF012", "PLW0108",
    "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206",
]
"scripts/**" = ["T201", "BLE001", "C901", "PLR0912", "PLR0915", "ANN001", "ANN201"]
"examples/**" = [
    "T201", "S101", "S105", "S106", "SLF001", "ARG002", "PLC0415",
    "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN206",
    # Tool-annotated types (ConnectionInfo subclasses) must be imported at
    # runtime — see flake8-type-checking config block above for rationale.
    # Example files demonstrate the *author* surface, where moving these to
    # TYPE_CHECKING would break the tools at decoration time.
    "TC001", "TC002", "TC003",
]
# Pydantic-modeled module: field types (`EnricherFn`, `ResolverRegistry`,
# `Mapping[...]`) must be importable at runtime for Pydantic to resolve them,
# so the TYPE_CHECKING-block ruff hints don't apply.
"src/a2kit/scaffold/_routers.py" = ["C901", "TC001", "TC003"]
# `App` composes FastMCP + Router internals; private-member access is the job.
"src/a2kit/app.py" = ["SLF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# cov-fail-under=100: v0.16 refilled the v0.15-test-deletion coverage drop
# with focused tests in tests/test_v16_coverage.py (formatter, lint AST
# helpers, app.py CLI body, projection, _otel, signature splicing, scaffold
# runner) and pragma'd a handful of genuinely-defensive branches.
addopts = "-v --strict-markers --cov --cov-report=term-missing --cov-fail-under=100"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/a2kit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[dependency-groups]
dev = [
    "mcp>=1.0",
    "opentelemetry-api>=1.20",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6",
    "ruff>=0.9",
    "vcrpy>=6",
    "diff-cover>=9",
    "ty>=0.0.34",
    "cel-python>=0.5",
]

[tool.a2kit.lint]
disabled = []

[tool.a2kit.check]
disabled = []

[tool.a2kit.runner]
default_select = "default and not write and not destructive"

[tool.a2kit.budgets]
total = 0

