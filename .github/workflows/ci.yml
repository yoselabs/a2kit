name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Sync deps
        run: uv sync --all-extras
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: ty (hard gate)
        run: uv run ty check src/
      - name: pytest
        run: uv run pytest
      - name: example-smoke (remote-MCP-access pattern)
        run: make example-smoke
      - name: a2kit lint
        run: uv run a2kit lint src/ tests/ examples/
      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
        # actionlint is pinned in Makefile (ACTIONLINT_VERSION). Keep in sync.
      - name: actionlint
        run: ./actionlint -color
